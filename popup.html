<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow Translator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <div class="popup-header">
            <div class="header-content">
                <h1 class="app-title">🌍 LinguaFlow</h1>
                <p class="app-subtitle">Video Translator</p>
            </div>
            <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
        </div>

        <!-- Main Content -->
        <div class="popup-content">
            <!-- Language Selection -->
            <div class="section">
                <label class="section-label">🎯 Target Language</label>
                <select id="targetLanguage" class="language-select">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese (Simplified)</option>
                    <option value="zh-TW">Chinese (Traditional)</option>
                    <option value="ru">Russian</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="tr">Turkish</option>
                    <option value="vi">Vietnamese</option>
                    <option value="th">Thai</option>
                    <option value="pl">Polish</option>
                    <option value="sv">Swedish</option>
                    <option value="nl">Dutch</option>
                    <option value="el">Greek</option>
                    <option value="he">Hebrew</option>
                </select>
            </div>

            <!-- Feature Toggles -->
            <div class="section">
                <div class="toggle-group">
                    <div class="toggle-item">
                        <label class="toggle-label">📝 Enable Captions</label>
                        <label class="switch">
                            <input type="checkbox" id="captionsToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="toggle-group">
                    <div class="toggle-item">
                        <label class="toggle-label">🔊 Translate Audio</label>
                        <label class="switch">
                            <input type="checkbox" id="audioToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="toggle-group">
                    <div class="toggle-item">
                        <label class="toggle-label">✨ Auto-Detect Language</label>
                        <label class="switch">
                            <input type="checkbox" id="autoDetectToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Caption Settings -->
            <div class="section collapsible">
                <button class="section-header-btn">
                    <span class="section-label">⚙️ Caption Settings</span>
                    <span class="collapse-icon">▼</span>
                </button>
                <div class="collapsible-content">
                    <div class="setting-item">
                        <label class="setting-label">Caption Size</label>
                        <select id="captionSize" class="setting-select">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Caption Opacity</label>
                        <div class="slider-container">
                            <input type="range" id="captionOpacity" min="0.3" max="1" step="0.1" value="0.9" class="range-slider">
                            <span id="opacityValue" class="opacity-value">90%</span>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Caption Delay (ms)</label>
                        <input type="number" id="captionDelay" min="0" max="2000" step="100" value="200" class="number-input">
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Caption Position</label>
                        <select id="captionPosition" class="setting-select">
                            <option value="bottom" selected>Bottom</option>
                            <option value="top">Top</option>
                            <option value="center">Center</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Advanced Settings -->
            <div class="section collapsible">
                <button class="section-header-btn">
                    <span class="section-label">🔧 Advanced</span>
                    <span class="collapse-icon">▼</span>
                </button>
                <div class="collapsible-content">
                    <div class="setting-item">
                        <label class="setting-label">Translation Service</label>
                        <select id="translationService" class="setting-select">
                            <option value="google" selected>Google Translate</option>
                            <option value="api">Custom API</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label class="setting-label">Speech Recognition</label>
                        <select id="speechRecognition" class="setting-select">
                            <option value="native" selected>Browser Native</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>

                    <button id="resetSettingsBtn" class="btn-reset">Reset to Defaults</button>
                </div>
            </div>

            <!-- Status & Info -->
            <div class="section">
                <div class="status-box">
                    <p class="status-text">
                        <span class="status-icon">ℹ️</span>
                        Navigate to any video page and toggle options above to start translating.
                    </p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="popup-footer">
            <button id="helpBtn" class="footer-btn" title="Help">?</button>
            <button id="feedbackBtn" class="footer-btn" title="Send Feedback">💬</button>
            <button id="rateBtn" class="footer-btn" title="Rate Extension">⭐</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
